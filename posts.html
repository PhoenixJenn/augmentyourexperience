<!DOCTYPE html>
<!-- 🎨 EASTER EGG: Triple-click the logo to reveal the theme switcher -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Posts — Augment Your Experience</title>
  <meta name="description" content="Every post from Augment Your Experience — practitioner-first writing on XR, AI, spatial computing, and 3D capture by Jenn Lee.">
  <link rel="stylesheet" href="css/main.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>

<body>

  <!-- Nav injected by shared.js -->
  <div id="nav-mount"></div>

  <!-- POSTS -->
  <div class="section">
    <div class="section-inner">

      <!-- PAGE HEADER -->
      <div style="margin-bottom:2rem;">
        <span class="hero-tag">All Posts</span>
        <h1 style="font-size:clamp(2rem,5vw,3rem);margin:1rem 0 0.5rem;">From the Field</h1>
        <p style="color:var(--text-muted);max-width:48ch;margin:0;">
          Everything I've built, broken, and learned since 2020.
        </p>
      </div>

      <!-- Tag filter — populated by posts.js -->
      <div id="tag-filter" class="tag-filter"></div>

      <!-- Post count -->
      <p id="post-count" style="color:var(--text-muted);font-size:0.85rem;margin-bottom:1.5rem;"></p>

      <!-- Post cards — populated by posts.js from posts.json -->
      <div id="post-grid" class="post-grid"></div>

    </div>
  </div>

  <!-- Footer injected by shared.js -->
  <div id="footer-mount"></div>

  <!-- Easter egg switcher injected by shared.js -->
  <div id="switcher-mount"></div>

  <script src="js/posts-data.js"></script>
  <script src="js/shared.js" data-base=""></script>
  <script src="js/posts.js"></script>

</body>
</html>
